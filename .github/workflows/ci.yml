name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: gofmt -d . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/mini-redis-server
      - run: make rehash-demo
      - run: make smoke
      - run: NETWORK_ENGINE=legacy PORT=16380 make smoke
